<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ الباركود المحمول</title>
    
    <!-- مكتبة Tailwind للتصميم المتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- مكتبة html5-qrcode لتشغيل الكاميرا وقراءة الباركود -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- مكتبة SheetJS لإنشاء ملفات الإكسل -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f3f6; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        #reader video { object-fit: cover; min-height: 250px; }
        /* إخفاء الروابط الإعلانية الخاصة بمكتبة الباركود */
        #reader__dashboard_section_csr span, #reader__dashboard_section_csr a { display: none !important; }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800">

    <!-- شريط العنوان -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center z-10 relative">
        <h1 class="text-xl font-bold">📱 قارئ الباركود (PowerPrint)</h1>
        <span id="badgeCount" class="bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-inner">0</span>
    </header>

    <!-- مساحة الكاميرا والتحكم -->
    <main class="flex-grow p-4 flex flex-col gap-4 overflow-hidden">
        
        <!-- الكاميرا -->
        <div id="reader" class="bg-black relative rounded-xl border-2 border-indigo-200"></div>

        <!-- أزرار التحكم بالكاميرا والمصباح -->
        <div class="flex gap-2">
            <button id="btnStart" class="flex-1 bg-green-600 hover:bg-green-700 disabled:bg-slate-400 text-white py-3 rounded-lg font-bold shadow transition-colors">
                ▶️ تشغيل الكاميرا
            </button>
            <button id="btnStop" class="flex-1 bg-slate-600 hover:bg-slate-700 disabled:bg-slate-400 text-white py-3 rounded-lg font-bold shadow transition-colors hidden">
                ⏹️ إيقاف
            </button>
            <button id="btnTorch" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white py-3 rounded-lg font-bold shadow transition-colors hidden">
                🔦 المصباح
            </button>
        </div>

        <!-- الإدخال اليدوي -->
        <div class="flex gap-2 bg-white p-2 rounded-lg shadow-sm border-2 border-indigo-100 items-center">
            <span class="text-2xl ml-1">⌨️</span>
            <input type="text" id="manualBarcode" placeholder="رقم الباركود اليدوي..." class="flex-1 border-0 bg-transparent focus:ring-0 text-lg py-2 text-left font-mono placeholder-slate-400" dir="ltr" inputmode="numeric">
            <button id="btnAddManual" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-md font-bold shadow transition-colors">إضافة</button>
        </div>

        <!-- قائمة الباركودات الممسوحة -->
        <div class="flex-grow flex flex-col min-h-0 bg-white rounded-lg shadow-sm border border-slate-200">
            <div class="bg-slate-100 p-2 text-sm font-bold text-slate-600 rounded-t-lg border-b border-slate-200 flex justify-between items-center">
                <span>الباركودات المقروءة:</span>
            </div>
            <div class="overflow-y-auto p-2 flex-grow" id="barcodeListContainer">
                <ul id="barcodeList" class="flex flex-col gap-2">
                    <li class="text-slate-400 text-center py-6 text-sm" id="emptyMsg">القائمة فارغة، ابدأ بمسح المواد...</li>
                </ul>
            </div>
        </div>
    </main>

    <!-- التصدير -->
    <footer class="p-4 bg-white border-t border-slate-200 z-10 relative flex flex-col gap-3">
        <button id="btnExport" class="w-full bg-indigo-600 active:bg-indigo-700 text-white py-3 rounded-xl font-bold shadow-md text-lg flex items-center justify-center gap-2 transition-transform transform active:scale-95">
            📥 حفظ الملف (Excel)
        </button>
        <div class="flex gap-2">
            <button id="btnShareFile" class="flex-1 bg-purple-600 active:bg-purple-700 text-white py-3 rounded-xl font-bold shadow-md flex items-center justify-center gap-2 transition-transform transform active:scale-95">
                📤 مشاركة الملف
            </button>
            <button id="btnSendWA" class="flex-1 bg-green-500 active:bg-green-600 text-white py-3 rounded-xl font-bold shadow-md flex items-center justify-center gap-2 transition-transform transform active:scale-95">
                💬 إرسال للرقم
            </button>
        </div>
    </footer>

    <!-- رسائل التنبيه العائمة (Toast) -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 whitespace-nowrap">
        تنبيه
    </div>

    <script>
        // المتغيرات الأساسية
        let html5QrCode = null;
        let scannedBarcodes = [];
        let isScanning = false;
        let torchOn = false;
        let lastScannedCode = "";
        let lastScannedTime = 0;
        
        // قفل الوعود لمنع الأخطاء
        let cameraOperationPromise = null;

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnTorch = document.getElementById('btnTorch');
        const btnExport = document.getElementById('btnExport');
        const btnShareFile = document.getElementById('btnShareFile');
        const btnSendWA = document.getElementById('btnSendWA');
        const btnAddManual = document.getElementById('btnAddManual');
        const manualBarcode = document.getElementById('manualBarcode');
        const barcodeList = document.getElementById('barcodeList');
        const emptyMsg = document.getElementById('emptyMsg');
        const badgeCount = document.getElementById('badgeCount');
        const toastEl = document.getElementById('toast');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.remove('opacity-0');
            setTimeout(() => toastEl.classList.add('opacity-0'), 2500);
        }

        function addBarcode(code) {
            code = code.trim();
            if (!code) return;

            const now = Date.now();
            if (code === lastScannedCode && (now - lastScannedTime) < 2000) {
                return;
            }

            lastScannedCode = code;
            lastScannedTime = now;
            
            scannedBarcodes.unshift(code);
            playBeep();
            updateUI();
            showToast(`تم مسح: ${code}`);
            
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function updateUI() {
            badgeCount.textContent = scannedBarcodes.length;
            
            if (scannedBarcodes.length === 0) {
                emptyMsg.style.display = 'block';
                barcodeList.innerHTML = '';
                barcodeList.appendChild(emptyMsg);
            } else {
                emptyMsg.style.display = 'none';
                barcodeList.innerHTML = '';
                scannedBarcodes.forEach((code, index) => {
                    const li = document.createElement('li');
                    li.className = 'bg-slate-50 p-3 rounded-md border border-slate-200 flex justify-between items-center text-lg font-mono shadow-sm';
                    li.innerHTML = `
                        <span class="font-bold text-slate-700">${code}</span>
                        <button onclick="removeBarcode(${index})" class="text-red-500 text-sm font-bold bg-red-100 hover:bg-red-200 px-3 py-1 rounded transition-colors">حذف</button>
                    `;
                    barcodeList.appendChild(li);
                });
            }
        }

        window.removeBarcode = function(index) {
            scannedBarcodes.splice(index, 1);
            updateUI();
        }

        // تشغيل الكاميرا المطور (متجاوب مع الدقة والفوكس)
        function startCamera() {
            if (cameraOperationPromise || isScanning) return; 

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            btnStart.disabled = true;
            btnStart.textContent = "جاري التشغيل...";

            // مساحة قراءة ضخمة ومتجاوبة مع حجم الشاشة (تأخذ 90% من العرض و 60% من الطول)
            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.9),
                        height: Math.floor(viewfinderHeight * 0.6)
                    };
                }
            };
            
            const onCameraStarted = () => {
                isScanning = true;
                torchOn = false;
                btnStart.classList.add('hidden');
                btnStop.classList.remove('hidden');
                btnTorch.classList.remove('hidden');
                btnTorch.innerHTML = '🔦 المصباح';
                btnTorch.classList.replace('bg-slate-700', 'bg-yellow-500');

                // إجبار الفوكس المستمر فور عمل الكاميرا لتوضيح الصورة
                const videoEl = document.querySelector("#reader video");
                if (videoEl && videoEl.srcObject) {
                    const track = videoEl.srcObject.getVideoTracks()[0];
                    if (track && track.getCapabilities) {
                        const caps = track.getCapabilities();
                        if (caps.focusMode && caps.focusMode.includes('continuous')) {
                            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(e => console.log(e));
                        }
                    }
                }
            };

            // 1. المحاولة الأولى: تشغيل الكاميرا الخلفية حصراً (هذا يضمن أقوى أداء للفوكس في الموبايل)
            cameraOperationPromise = html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                (decodedText) => { addBarcode(decodedText); },
                (errorMessage) => { /* صمت */ }
            ).then(() => {
                onCameraStarted();
            }).catch((err) => {
                // 2. المحاولة الثانية: إذا فشلت (كأن تكون تستخدم لابتوب)، نجلب الكاميرا الأمامية
                return Html5Qrcode.getCameras().then(devices => {
                    if (devices && devices.length > 0) {
                        return html5QrCode.start(
                            devices[0].id, 
                            config,
                            (decodedText) => { addBarcode(decodedText); },
                            (errorMessage) => { /* صمت */ }
                        ).then(() => {
                            onCameraStarted();
                        });
                    } else {
                        throw new Error("NoCamerasFound");
                    }
                });
            }).catch((err) => {
                let errorMsg = "فشل الكاميرا! تأكد من الصلاحيات.";
                if (window.isSecureContext === false) {
                    errorMsg = "يحتاج الموقع إلى HTTPS لتشغيل الكاميرا.";
                } else if (err && typeof err === 'string' && err.includes('NotAllowedError')) {
                    errorMsg = "مرفوض! الرجاء السماح بالكاميرا.";
                } else if (err && err.name === 'NotAllowedError') {
                    errorMsg = "مرفوض! الرجاء السماح بالكاميرا.";
                } else if (err && (err.name === 'NotFoundError' || err.message === 'NoCamerasFound')) {
                    errorMsg = "لا توجد كاميرا متصلة بالجهاز.";
                } else {
                    errorMsg = "حدث خطأ: " + (err.message || err);
                }
                showToast(errorMsg);
                console.error("Camera Start Error:", err);
            }).finally(() => {
                cameraOperationPromise = null;
                btnStart.disabled = false;
                btnStart.textContent = "▶️ تشغيل الكاميرا";
            });
        }

        function stopCamera() {
            if (cameraOperationPromise || !isScanning || !html5QrCode) return; 
            
            btnStop.disabled = true;
            btnStop.textContent = "جاري الإيقاف...";

            cameraOperationPromise = html5QrCode.stop().then(() => {
                isScanning = false;
                torchOn = false;
                btnStop.classList.add('hidden');
                btnTorch.classList.add('hidden');
                btnStart.classList.remove('hidden');
            }).catch(err => {
                console.log("Error stopping camera", err);
            }).finally(() => {
                cameraOperationPromise = null;
                btnStop.disabled = false;
                btnStop.textContent = "⏹️ إيقاف";
            });
        }

        btnTorch.addEventListener('click', async () => {
            if (!isScanning) return;
            
            const videoEl = document.querySelector("#reader video");
            if (videoEl && videoEl.srcObject) {
                const track = videoEl.srcObject.getVideoTracks()[0];
                if (!track) return;
                
                const capabilities = track.getCapabilities && track.getCapabilities() || {};
                
                if (capabilities.torch) {
                    torchOn = !torchOn;
                    try {
                        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                        btnTorch.innerHTML = torchOn ? '💡 إطفاء' : '🔦 المصباح';
                        if(torchOn) {
                            btnTorch.classList.replace('bg-yellow-500', 'bg-slate-700');
                        } else {
                            btnTorch.classList.replace('bg-slate-700', 'bg-yellow-500');
                        }
                    } catch (e) {
                        showToast("المتصفح لا يسمح بالتحكم بالمصباح");
                    }
                } else {
                    showToast("المصباح غير مدعوم في جهازك أو متصفحك");
                }
            }
        });

        function createExcelWorkbook() {
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const fileName = `bar${yy}${mm}${dd}-${hh}${mins}${ss}.xlsx`;

            const ws_data = [...scannedBarcodes].reverse().map(code => [code]);
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Barcodes");

            return { wb, fileName };
        }

        function exportExcel() {
            if (scannedBarcodes.length === 0) { showToast("القائمة فارغة!"); return; }
            const { wb, fileName } = createExcelWorkbook();
            XLSX.writeFile(wb, fileName);
            showToast("تم التحميل بنجاح! 📥");
        }

        function shareExcelFile() {
            if (scannedBarcodes.length === 0) { showToast("القائمة فارغة!"); return; }
            const { wb, fileName } = createExcelWorkbook();
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: "application/octet-stream" });
            const file = new File([blob], fileName, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    title: 'ملف الباركودات',
                    text: 'مرفق ملف الإكسل الخاص بالباركودات الممسوحة بواسطة PowerPrint',
                    files: [file]
                }).catch(err => console.log("Share failed", err));
            } else {
                showToast("المشاركة المباشرة غير مدعومة هنا، استخدم الحفظ.");
            }
        }

        function sendToWhatsApp() {
            if (scannedBarcodes.length === 0) { showToast("القائمة فارغة!"); return; }
            const phoneNumber = "9647705964573";
            const list = [...scannedBarcodes].reverse().join("\n");
            const text = "مرحباً، هذه قائمة الباركودات الممسوحة (PowerPrint):\n\n" + list;
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        btnExport.addEventListener('click', exportExcel);
        btnShareFile.addEventListener('click', shareExcelFile);
        btnSendWA.addEventListener('click', sendToWhatsApp);
        
        btnAddManual.addEventListener('click', () => {
            const val = manualBarcode.value;
            if(val) {
                addBarcode(val);
                manualBarcode.value = '';
                manualBarcode.focus();
            }
        });

        manualBarcode.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnAddManual.click();
            }
        });

    </script>
</body>
</html>
