<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ الباركود الخارق | PowerPrint</title>
    
    <!-- مكتبة Tailwind للتصميم المتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- مكتبة html5-qrcode (كمحرك احتياطي) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- مكتبة SheetJS لإنشاء ملفات الإكسل -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <!-- مكتبة Lucide للأيقونات الاحترافية -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'slide-up': 'slideUp 0.3s ease-out forwards',
                        'toast': 'toastSlide 3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(15px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        toastSlide: {
                            '0%': { opacity: 0, transform: 'translate(-50%, 20px)' },
                            '10%': { opacity: 1, transform: 'translate(-50%, 0)' },
                            '90%': { opacity: 1, transform: 'translate(-50%, 0)' },
                            '100%': { opacity: 0, transform: 'translate(-50%, -20px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
        
        /* تأثير خط المسح الليزري للمحرك الخارق */
        @keyframes scan { 
            0% { top: 5%; opacity: 0; } 
            10% { opacity: 1;}
            90% { opacity: 1;}
            100% { top: 95%; opacity: 0; } 
        }
        .scan-line { 
            animation: scan 2s infinite linear; 
        }
        
        /* تنسيقات حاوية الكاميرا للمحرك الاحتياطي */
        #reader { width: 100%; border: none; border-radius: 1.5rem; overflow: hidden; }
        #reader video { object-fit: cover; min-height: 280px; width: 100%; border-radius: 1.5rem; }
        #reader__dashboard_section_csr span, #reader__dashboard_section_swaplink { display: none !important; }
        #reader__dashboard_section_csr button {
            background: linear-gradient(to right, #2563eb, #4f46e5) !important; color: white !important;
            border: none !important; padding: 10px 20px !important;
            border-radius: 12px !important; font-family: 'Tajawal', sans-serif !important;
            font-weight: bold !important; margin-top: 10px !important;
        }

        /* شريط التمرير المخفي */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="text-slate-800 pb-28 selection:bg-blue-200">

    <!-- شريط العنوان -->
    <header class="glass-header shadow-sm border-b border-slate-200/60 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-5 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-blue-500/20">
                    <i data-lucide="scan-line" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 leading-tight tracking-tight">الماسح الذكي</h1>
                    <p class="text-xs font-semibold mt-0.5" id="engine-status">جاري فحص المحرك...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="scan-counter" class="bg-indigo-50 text-indigo-700 font-bold px-3.5 py-1.5 rounded-full text-sm border border-indigo-100 shadow-sm">
                    0 مادة
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">
        
        <!-- حاوية الكاميرا المدمجة -->
        <div class="relative bg-slate-900 rounded-[2rem] overflow-hidden shadow-[0_8px_30px_rgba(0,0,0,0.15)] mb-6 flex items-center justify-center min-h-[280px] border-[6px] border-slate-800 ring-1 ring-black/5">
            
            <!-- 1. المحرك الخارق (Native) -->
            <video id="native-video" class="w-full h-full object-cover hidden absolute inset-0 rounded-[1.5rem]" autoplay playsinline></video>
            <div id="scan-line" class="absolute left-4 right-4 h-[2px] bg-red-500 shadow-[0_0_15px_rgba(239,68,68,1)] hidden scan-line z-10 rounded-full"></div>
            
            <!-- 2. المحرك الاحتياطي (html5-qrcode) -->
            <div id="reader" class="w-full h-full hidden absolute inset-0 bg-slate-900"></div>
            
            <!-- شاشة التوقف -->
            <div id="camera-placeholder" class="text-slate-400 flex flex-col items-center py-12 z-0">
                <div class="bg-slate-800/50 p-4 rounded-full mb-4">
                    <i data-lucide="camera-off" class="w-10 h-10 opacity-70 text-slate-300"></i>
                </div>
                <span class="font-bold text-slate-300">الكاميرا متوقفة</span>
            </div>
        </div>

        <!-- أزرار التحكم بالكاميرا -->
        <div class="flex gap-3 mb-8">
            <button id="btn-start" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <i data-lucide="play" class="w-5 h-5"></i>
                بدء المسح
            </button>
            <button id="btn-stop" class="flex-1 bg-gradient-to-r from-rose-500 to-red-500 hover:from-rose-600 hover:to-red-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-red-500/25 transition-all flex items-center justify-center gap-2 hidden active:scale-[0.98]">
                <i data-lucide="square" class="w-5 h-5 fill-current"></i>
                إيقاف الكاميرا
            </button>
        </div>

        <!-- الإدخال اليدوي -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-2 h-full bg-indigo-500"></div>
            <label class="block text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                <i data-lucide="keyboard" class="w-4 h-4 text-indigo-500"></i> إدخال الباركود يدوياً:
            </label>
            <div class="flex gap-2">
                <input type="text" id="manual-barcode" placeholder="اكتب أو الصق الباركود هنا..." 
                    class="flex-1 bg-slate-50 border border-slate-200 text-slate-900 text-lg rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent block w-full p-3.5 transition-all outline-none font-mono" dir="ltr">
                <button id="btn-add-manual" class="bg-slate-800 hover:bg-slate-900 text-white px-6 rounded-2xl font-bold transition-all shadow-md active:scale-[0.95] flex items-center justify-center">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- قائمة الباركودات -->
        <div class="flex items-center justify-between mb-4 px-2">
            <h2 class="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                <i data-lucide="list-checks" class="w-5 h-5 text-indigo-600"></i>
                المواد الممسوحة
            </h2>
            <button id="btn-clear-all" class="text-red-500 hover:text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1.5 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                مسح الكل
            </button>
        </div>

        <div class="mb-6">
            <ul id="barcode-list" class="space-y-3">
                <!-- العناصر تضاف هنا عبر جافاسكريبت -->
                <li class="bg-white p-8 text-center text-slate-400 font-medium rounded-3xl shadow-sm border border-slate-100 border-dashed flex flex-col items-center justify-center" id="empty-state">
                    <div class="bg-slate-50 p-4 rounded-full mb-3">
                        <i data-lucide="package-open" class="w-8 h-8 text-slate-300"></i>
                    </div>
                    لم يتم مسح أي باركود بعد.<br>ابدأ الكاميرا أو أدخل الرقم يدوياً.
                </li>
            </ul>
        </div>

    </main>

    <!-- شريط الإجراءات السفلي (التصدير) -->
    <div class="fixed bottom-0 left-0 w-full glass-header border-t border-slate-200/60 p-4 shadow-[0_-4px_25px_-5px_rgba(0,0,0,0.05)] z-40">
        <div class="max-w-3xl mx-auto flex gap-3">
            <button id="btn-export" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
                تصدير Excel
            </button>
            <button id="btn-send-wa" class="flex-1 bg-gradient-to-r from-[#25D366] to-[#128C7E] hover:from-[#20bd5a] hover:to-[#0f7a6e] text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-500/25 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <i data-lucide="send" class="w-5 h-5 fill-current"></i>
                إرسال واتساب
            </button>
        </div>
    </div>

    <!-- حاوية الإشعارات العائمة (Toasts) -->
    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2 w-[90%] max-w-sm"></div>

    <!-- Modal تأكيد الحذف الاحترافي -->
    <div id="delete-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[2rem] p-6 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="delete-modal-content">
            <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-8 h-8 text-red-500"></i>
            </div>
            <h3 class="text-xl font-extrabold text-center text-slate-800 mb-2">حذف جميع المواد؟</h3>
            <p class="text-center text-slate-500 mb-6 font-medium">هذا الإجراء لا يمكن التراجع عنه. هل أنت متأكد؟</p>
            <div class="flex gap-3">
                <button id="btn-cancel-delete" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-2xl transition-colors">إلغاء</button>
                <button id="btn-confirm-delete" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-2xl transition-colors shadow-lg shadow-red-500/30">نعم، احذف</button>
            </div>
        </div>
    </div>

    <!-- صوت القراءة -->
    <audio id="beep-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        // تهيئة أيقونات Lucide
        lucide.createIcons();

        // نظام الإشعارات العائمة
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-slate-800';
            const icon = type === 'error' ? 'alert-circle' : 'check-circle-2';

            toast.className = `${bgColor} text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 font-bold text-sm animate-toast backdrop-blur-md`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 shrink-0"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => { toast.remove(); }, 3000);
        }

        // المتغيرات الأساسية (نفس النظام القديم بالضبط: مصفوفة نصوص)
        let barcodes = JSON.parse(localStorage.getItem('saved_barcodes')) || [];
        
        // عناصر الواجهة
        const listContainer = document.getElementById('barcode-list');
        const emptyState = document.getElementById('empty-state');
        const counterElement = document.getElementById('scan-counter');
        const beepSound = document.getElementById('beep-sound');
        const manualBarcode = document.getElementById('manual-barcode');
        const engineStatus = document.getElementById('engine-status');
        
        // أزرار
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnExport = document.getElementById('btn-export');
        const btnSendWA = document.getElementById('btn-send-wa');
        const btnAddManual = document.getElementById('btn-add-manual');
        const btnClearAll = document.getElementById('btn-clear-all');

        // متغيرات نافذة الحذف المنبثقة
        const deleteModal = document.getElementById('delete-modal');
        const deleteModalContent = document.getElementById('delete-modal-content');
        const btnCancelDelete = document.getElementById('btn-cancel-delete');
        const btnConfirmDelete = document.getElementById('btn-confirm-delete');

        // متغيرات المحركات
        const isNativeSupported = ('BarcodeDetector' in window);
        let barcodeDetector = null;
        let nativeStream = null;
        let isNativeScanning = false;
        let lastNativeScanTime = 0;
        let html5QrCode = null; // للمحرك الاحتياطي

        // التحقق من المحرك المستخدم وإظهاره للمستخدم
        if (isNativeSupported) {
            barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'upc_a', 'qr_code'] });
            engineStatus.innerHTML = '<span class="text-emerald-500">⚡ المحرك الخارق (Native)</span>';
        } else {
            engineStatus.innerHTML = '<span class="text-orange-500">🐢 المحرك الاحتياطي (Web)</span>';
        }

        // تحديث القائمة عند التحميل
        updateList();

        // إضافة باركود جديد
        function addBarcode(code) {
            code = code.trim();
            if (!code) return;

            // منع التكرار
            if (barcodes.includes(code)) {
                showToast('هذا الباركود موجود مسبقاً!', 'error');
                return;
            }

            // إضافة للبداية (الأحدث يظهر فوق)
            barcodes.unshift(code);
            saveData();
            updateList();

            // تشغيل الصوت والاهتزاز
            try {
                beepSound.currentTime = 0;
                beepSound.play().catch(e => console.log("الصوت محظور مؤقتاً:", e));
                if (navigator.vibrate) navigator.vibrate(100);
            } catch (e) {}
        }

        // إزالة باركود
        function removeBarcode(index) {
            barcodes.splice(index, 1);
            saveData();
            updateList();
            showToast('تم حذف الباركود');
        }

        // حفظ في LocalStorage
        function saveData() {
            localStorage.setItem('saved_barcodes', JSON.stringify(barcodes));
        }

        // تحديث واجهة المستخدم للقائمة
        function updateList() {
            counterElement.innerText = `${barcodes.length} مادة`;
            
            if (barcodes.length === 0) {
                listContainer.innerHTML = '';
                listContainer.appendChild(emptyState);
                emptyState.style.display = 'flex';
                return;
            }

            emptyState.style.display = 'none';
            listContainer.innerHTML = '';

            barcodes.forEach((code, index) => {
                const li = document.createElement('li');
                li.className = 'bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center animate-slide-up group hover:border-indigo-200 transition-colors duration-300';
                
                li.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <div class="bg-indigo-50 text-indigo-600 w-10 h-10 rounded-xl flex items-center justify-center font-bold text-sm shrink-0 border border-indigo-100">
                            ${barcodes.length - index}
                        </div>
                        <span class="text-slate-800 font-mono text-lg font-bold truncate" dir="ltr">${code}</span>
                    </div>
                    <button onclick="removeBarcode(${index})" class="text-slate-300 hover:text-red-500 hover:bg-red-50 w-10 h-10 rounded-xl flex items-center justify-center transition-all" title="حذف">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                `;
                listContainer.appendChild(li);
            });
            
            lucide.createIcons();
        }

        // ==========================================
        // أنظمة الكاميرا (الخارق + الاحتياطي)
        // ==========================================

        async function startCamera() {
            btnStart.classList.add('hidden');
            btnStop.classList.remove('hidden');
            document.getElementById('camera-placeholder').classList.add('hidden');

            if (isNativeSupported) {
                // تشغيل المحرك الخارق
                try {
                    const video = document.getElementById('native-video');
                    nativeStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    video.srcObject = nativeStream;
                    video.classList.remove('hidden');
                    document.getElementById('scan-line').classList.remove('hidden');
                    
                    isNativeScanning = true;
                    detectNativeLoop(video);
                } catch (err) {
                    showToast("تعذر فتح الكاميرا: " + err.message, "error");
                    stopCamera();
                }
            } else {
                // تشغيل المحرك الاحتياطي
                document.getElementById('reader').classList.remove('hidden');
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                
                html5QrCode.start({ facingMode: "environment" }, config, 
                    (decodedText) => { addBarcode(decodedText); },
                    (errorMessage) => { /* تجاهل أخطاء عدم العثور المستمرة */ }
                ).catch((err) => {
                    showToast("فشل تشغيل الكاميرا!", "error");
                    stopCamera();
                });
            }
        }

        async function detectNativeLoop(video) {
            if (!isNativeScanning || !barcodeDetector) return;

            try {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    const codes = await barcodeDetector.detect(video);
                    if (codes.length > 0) {
                        let code = codes[0].rawValue;
                        let now = Date.now();
                        // تأخير زمني 1 ثانية بين كل قراءة لنفس الكاميرا لتجنب التكرار
                        if (now - lastNativeScanTime > 1000) {
                            addBarcode(code);
                            lastNativeScanTime = now;
                        }
                    }
                }
            } catch (e) {}

            requestAnimationFrame(() => detectNativeLoop(video));
        }

        function stopCamera() {
            btnStop.classList.add('hidden');
            btnStart.classList.remove('hidden');
            document.getElementById('camera-placeholder').classList.remove('hidden');

            if (isNativeSupported) {
                // إيقاف المحرك الخارق
                isNativeScanning = false;
                if (nativeStream) {
                    nativeStream.getTracks().forEach(track => track.stop());
                }
                document.getElementById('native-video').classList.add('hidden');
                document.getElementById('scan-line').classList.add('hidden');
            } else {
                // إيقاف المحرك الاحتياطي
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('reader').classList.add('hidden');
                        html5QrCode.clear();
                    }).catch(err => console.log("خطأ في الإيقاف", err));
                }
            }
        }

        // ==========================================
        // التصدير والواتساب
        // ==========================================

        function exportExcel() {
            if (barcodes.length === 0) {
                showToast("لا توجد بيانات لتصديرها!", "error");
                return;
            }

            const data = [["الباركود"]];
            // عكس المصفوفة ليكون الترتيب من الأقدم للأحدث في الإكسل
            [...barcodes].reverse().forEach(code => {
                data.push([code]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{ wch: 25 }];
            XLSX.utils.book_append_sheet(wb, ws, "الباركودات");
            
            const fileName = `Barcodes_${new Date().getTime()}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast("تم تصدير الإكسل بنجاح");
        }

        function sendToWhatsApp() {
            if (barcodes.length === 0) {
                showToast("لا توجد بيانات لإرسالها!", "error");
                return;
            }

            // رقم الواتساب الثابت بناءً على طلبك
            const phoneNumber = "009647705964573";

            const fileName = `Barcodes_${new Date().getTime()}.xlsx`;
            const barcodesStr = JSON.stringify([...barcodes].reverse());
            
            const pyCode = `import os
import sys
import subprocess
from pathlib import Path

try:
    import openpyxl
except ImportError:
    print("جاري تثبيت المكتبات المطلوبة (openpyxl)...")
    subprocess.check_call([sys.executable, "-m", "pip", "install", "openpyxl", "-q"])
    import openpyxl

wb = openpyxl.Workbook()
ws = wb.active
ws.title = "Barcodes"
barcodes = ${barcodesStr}

for i, code in enumerate(barcodes, 1):
    ws.cell(row=i, column=1, value=str(code))

file_path = Path.home() / "Downloads" / "${fileName}"
wb.save(file_path)

print(f"\\n✅ تم حفظ الملف بنجاح في:\\n{file_path}")
input("\\nاضغط Enter للإغلاق...")`;

            const text = `مرحباً، انسخ كود البايثون التالي لإنشاء ملف الإكسل:\n\n\`\`\`python\n${pyCode}\n\`\`\``;
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(text)}`;
            
            window.open(url, '_blank');
            showToast("جاري فتح الواتساب...");
        }

        // ==========================================
        // ربط الأحداث
        // ==========================================

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        btnExport.addEventListener('click', exportExcel);
        btnSendWA.addEventListener('click', sendToWhatsApp);
        
        btnAddManual.addEventListener('click', () => {
            const val = manualBarcode.value;
            if(val) {
                addBarcode(val);
                manualBarcode.value = '';
                manualBarcode.focus();
            }
        });

        // إضافة عند ضغط Enter
        manualBarcode.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') btnAddManual.click();
        });

        // دوال نافذة تأكيد الحذف
        function openDeleteModal() {
            if(barcodes.length === 0) return;
            deleteModal.classList.remove('hidden');
            // تفعيل الحركة (Reflow)
            void deleteModal.offsetWidth;
            deleteModal.classList.remove('opacity-0');
            deleteModalContent.classList.remove('scale-95');
        }

        function closeDeleteModal() {
            deleteModal.classList.add('opacity-0');
            deleteModalContent.classList.add('scale-95');
            setTimeout(() => {
                deleteModal.classList.add('hidden');
            }, 300);
        }

        btnClearAll.addEventListener('click', openDeleteModal);
        btnCancelDelete.addEventListener('click', closeDeleteModal);
        
        btnConfirmDelete.addEventListener('click', () => {
            barcodes = [];
            saveData();
            updateList();
            showToast("تم تنظيف القائمة");
            closeDeleteModal();
        });

    </script>
</body>
</html>
