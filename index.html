<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ الباركود الخارق | PowerPrint</title>
    
    <!-- مكتبة Tailwind للتصميم المتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- مكتبة html5-qrcode (كمحرك احتياطي) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- مكتبة SheetJS لإنشاء ملفات الإكسل -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <!-- مكتبة Lucide للأيقونات الاحترافية -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        
        /* تأثير خط المسح الليزري للمحرك الخارق */
        @keyframes scan { 
            0% { top: 10%; } 
            100% { top: 90%; } 
        }
        .scan-line { 
            animation: scan 2s infinite linear alternate; 
        }
        
        /* تنسيقات حاوية الكاميرا للمحرك الاحتياطي */
        #reader { width: 100%; border: none; }
        #reader video { object-fit: cover; min-height: 260px; width: 100%; }
        #reader__dashboard_section_csr span, #reader__dashboard_section_swaplink { display: none !important; }
        #reader__dashboard_section_csr button {
            background-color: #3b82f6 !important; color: white !important;
            border: none !important; padding: 8px 16px !important;
            border-radius: 8px !important; font-family: 'Tajawal', sans-serif !important;
        }

        /* شريط التمرير المخفي */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- شريط العنوان -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i data-lucide="scan-line" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">الماسح الذكي</h1>
                    <p class="text-xs text-slate-500 font-medium" id="engine-status">جاري فحص المحرك...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="scan-counter" class="bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-full text-sm">
                    0 مادة
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6">
        
        <!-- حاوية الكاميرا المدمجة -->
        <div class="relative bg-black rounded-2xl overflow-hidden shadow-lg mb-6 flex items-center justify-center min-h-[260px] border-4 border-slate-800">
            
            <!-- 1. المحرك الخارق (Native) -->
            <video id="native-video" class="w-full h-full object-cover hidden absolute inset-0" autoplay playsinline></video>
            <div id="scan-line" class="absolute left-0 w-full h-[2px] bg-blue-500 shadow-[0_0_15px_rgba(59,130,246,1)] hidden scan-line z-10"></div>
            
            <!-- 2. المحرك الاحتياطي (html5-qrcode) -->
            <div id="reader" class="w-full h-full hidden absolute inset-0 bg-black"></div>
            
            <!-- شاشة التوقف -->
            <div id="camera-placeholder" class="text-slate-400 flex flex-col items-center py-12 z-0">
                <i data-lucide="camera-off" class="w-12 h-12 mb-3 opacity-50"></i>
                <span class="font-medium">الكاميرا متوقفة</span>
            </div>
        </div>

        <!-- أزرار التحكم بالكاميرا -->
        <div class="flex gap-3 mb-8">
            <button id="btn-start" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <i data-lucide="play" class="w-5 h-5"></i>
                بدء المسح
            </button>
            <button id="btn-stop" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 hidden active:scale-[0.98]">
                <i data-lucide="square" class="w-5 h-5 fill-current"></i>
                إيقاف الكاميرا
            </button>
        </div>

        <!-- الإدخال اليدوي -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <label class="block text-sm font-bold text-slate-700 mb-2">إدخال الباركود يدوياً:</label>
            <div class="flex gap-2">
                <input type="text" id="manual-barcode" placeholder="اكتب أو الصق الباركود هنا..." 
                    class="flex-1 bg-slate-50 border border-slate-300 text-slate-900 text-lg rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full p-3 transition-colors" dir="ltr">
                <button id="btn-add-manual" class="bg-slate-800 hover:bg-slate-900 text-white px-5 rounded-xl font-bold transition-colors active:scale-[0.98]">
                    إضافة
                </button>
            </div>
        </div>

        <!-- قائمة الباركودات -->
        <div class="flex items-center justify-between mb-3 px-1">
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="list-ordered" class="w-5 h-5 text-blue-600"></i>
                المواد الممسوحة
            </h2>
            <button id="btn-clear-all" class="text-red-500 hover:text-red-700 text-sm font-bold flex items-center gap-1 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                مسح الكل
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
            <ul id="barcode-list" class="divide-y divide-slate-100 max-h-[35vh] overflow-y-auto no-scrollbar">
                <!-- العناصر تضاف هنا عبر جافاسكريبت -->
                <li class="p-8 text-center text-slate-400 font-medium" id="empty-state">
                    لم يتم مسح أي باركود بعد.<br>ابدأ الكاميرا أو أدخل الرقم يدوياً.
                </li>
            </ul>
        </div>

    </main>

    <!-- شريط الإجراءات السفلي (التصدير) -->
    <div class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
        <div class="max-w-3xl mx-auto flex gap-3">
            <button id="btn-export" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
                تحميل Excel
            </button>
            <button id="btn-send-wa" class="flex-1 bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <i data-lucide="send" class="w-5 h-5"></i>
                إرسال واتساب
            </button>
        </div>
    </div>

    <!-- صوت القراءة -->
    <audio id="beep-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        // تهيئة أيقونات Lucide
        lucide.createIcons();

        // المتغيرات الأساسية
        let barcodes = JSON.parse(localStorage.getItem('saved_barcodes')) || [];
        
        // عناصر الواجهة
        const listContainer = document.getElementById('barcode-list');
        const emptyState = document.getElementById('empty-state');
        const counterElement = document.getElementById('scan-counter');
        const beepSound = document.getElementById('beep-sound');
        const manualBarcode = document.getElementById('manual-barcode');
        const engineStatus = document.getElementById('engine-status');
        
        // أزرار
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnExport = document.getElementById('btn-export');
        const btnSendWA = document.getElementById('btn-send-wa');
        const btnAddManual = document.getElementById('btn-add-manual');
        const btnClearAll = document.getElementById('btn-clear-all');

        // متغيرات المحركات
        const isNativeSupported = ('BarcodeDetector' in window);
        let barcodeDetector = null;
        let nativeStream = null;
        let isNativeScanning = false;
        let lastNativeScanTime = 0;
        let html5QrCode = null; // للمحرك الاحتياطي

        // التحقق من المحرك المستخدم وإظهاره للمستخدم
        if (isNativeSupported) {
            barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'upc_a', 'qr_code'] });
            engineStatus.innerHTML = '<span class="text-green-300 font-bold">⚡ المحرك الخارق مفعل</span>';
        } else {
            engineStatus.innerHTML = '<span class="text-orange-300 font-bold">🐢 المحرك الاحتياطي مفعل</span>';
        }

        // تحديث القائمة عند التحميل
        updateList();

        // إضافة باركود جديد (الدالة المركزية)
        function addBarcode(code) {
            code = code.trim();
            if (!code) return;

            // منع التكرار
            if (barcodes.includes(code)) return;

            // إضافة للبداية (الأحدث يظهر فوق)
            barcodes.unshift(code);
            saveData();
            updateList();

            // تشغيل الصوت والاهتزاز
            try {
                beepSound.currentTime = 0;
                beepSound.play().catch(e => console.log("الصوت محظور مؤقتاً:", e));
                if (navigator.vibrate) navigator.vibrate(150);
            } catch (e) {}
        }

        // إزالة باركود
        function removeBarcode(index) {
            barcodes.splice(index, 1);
            saveData();
            updateList();
        }

        // حفظ في LocalStorage
        function saveData() {
            localStorage.setItem('saved_barcodes', JSON.stringify(barcodes));
        }

        // تحديث واجهة المستخدم للقائمة
        function updateList() {
            counterElement.innerText = `${barcodes.length} مادة`;
            
            if (barcodes.length === 0) {
                listContainer.innerHTML = '';
                listContainer.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            listContainer.innerHTML = '';

            barcodes.forEach((code, index) => {
                const li = document.createElement('li');
                li.className = 'p-4 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors group';
                
                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="bg-blue-100 text-blue-700 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0">
                            ${barcodes.length - index}
                        </div>
                        <span class="text-slate-800 font-mono text-lg font-semibold truncate" dir="ltr">${code}</span>
                    </div>
                    <button onclick="removeBarcode(${index})" class="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-all" title="حذف">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                `;
                listContainer.appendChild(li);
            });
            
            lucide.createIcons();
        }

        // ==========================================
        // أنظمة الكاميرا (الخارق + الاحتياطي)
        // ==========================================

        async function startCamera() {
            btnStart.classList.add('hidden');
            btnStop.classList.remove('hidden');
            document.getElementById('camera-placeholder').classList.add('hidden');

            if (isNativeSupported) {
                // تشغيل المحرك الخارق
                try {
                    const video = document.getElementById('native-video');
                    nativeStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                    video.srcObject = nativeStream;
                    video.classList.remove('hidden');
                    document.getElementById('scan-line').classList.remove('hidden');
                    
                    isNativeScanning = true;
                    detectNativeLoop(video);
                } catch (err) {
                    alert("تعذر فتح الكاميرا: " + err.message);
                    stopCamera();
                }
            } else {
                // تشغيل المحرك الاحتياطي
                document.getElementById('reader').classList.remove('hidden');
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                
                html5QrCode.start({ facingMode: "environment" }, config, 
                    (decodedText) => { addBarcode(decodedText); },
                    (errorMessage) => { /* تجاهل أخطاء عدم العثور المستمرة */ }
                ).catch((err) => {
                    alert("فشل تشغيل الكاميرا: " + err);
                    stopCamera();
                });
            }
        }

        async function detectNativeLoop(video) {
            if (!isNativeScanning || !barcodeDetector) return;

            try {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    const codes = await barcodeDetector.detect(video);
                    if (codes.length > 0) {
                        let code = codes[0].rawValue;
                        let now = Date.now();
                        // تأخير زمني 1 ثانية بين كل قراءة لنفس الكاميرا
                        if (now - lastNativeScanTime > 1000) {
                            addBarcode(code);
                            lastNativeScanTime = now;
                        }
                    }
                }
            } catch (e) {}

            requestAnimationFrame(() => detectNativeLoop(video));
        }

        function stopCamera() {
            btnStop.classList.add('hidden');
            btnStart.classList.remove('hidden');
            document.getElementById('camera-placeholder').classList.remove('hidden');

            if (isNativeSupported) {
                // إيقاف المحرك الخارق
                isNativeScanning = false;
                if (nativeStream) {
                    nativeStream.getTracks().forEach(track => track.stop());
                }
                document.getElementById('native-video').classList.add('hidden');
                document.getElementById('scan-line').classList.add('hidden');
            } else {
                // إيقاف المحرك الاحتياطي
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('reader').classList.add('hidden');
                        html5QrCode.clear();
                    }).catch(err => console.log("خطأ في الإيقاف", err));
                }
            }
        }

        // ==========================================
        // التصدير والواتساب
        // ==========================================

        function exportExcel() {
            if (barcodes.length === 0) {
                alert("لا توجد بيانات لتصديرها!");
                return;
            }

            const data = [["الباركود"]];
            // عكس المصفوفة ليكون الترتيب من الأقدم للأحدث في الإكسل
            [...barcodes].reverse().forEach(code => {
                data.push([code]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            
            // ضبط عرض العمود
            ws['!cols'] = [{ wch: 25 }];
            
            XLSX.utils.book_append_sheet(wb, ws, "الباركودات");
            
            const fileName = `Barcodes_${new Date().getTime()}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        function sendToWhatsApp() {
            if (barcodes.length === 0) {
                alert("لا توجد بيانات لإرسالها!");
                return;
            }

            const phoneNumber = prompt("أدخل رقم الواتساب (مع رمز الدولة، مثال: 9647...):");
            if (!phoneNumber) return;

            const fileName = `Barcodes_${new Date().getTime()}.xlsx`;
            const barcodesStr = JSON.stringify([...barcodes].reverse());
            
            // السكريبت الخاص بك لتوليد ملف إكسل من البايثون
            const pyCode = `import os
import sys
import subprocess
from pathlib import Path

try:
    import openpyxl
except ImportError:
    print("جاري تثبيت المكتبات المطلوبة (openpyxl)...")
    subprocess.check_call([sys.executable, "-m", "pip", "install", "openpyxl", "-q"])
    import openpyxl

wb = openpyxl.Workbook()
ws = wb.active
ws.title = "Barcodes"
barcodes = ${barcodesStr}

for i, code in enumerate(barcodes, 1):
    ws.cell(row=i, column=1, value=str(code))

file_path = Path.home() / "Downloads" / "${fileName}"
wb.save(file_path)

print(f"\\n✅ تم حفظ الملف بنجاح في:\\n{file_path}")
input("\\nاضغط Enter للإغلاق...")`;

            const text = `مرحباً، انسخ كود البايثون التالي لإنشاء ملف الإكسل:\n\n\`\`\`python\n${pyCode}\n\`\`\``;
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        // ==========================================
        // ربط الأحداث المتبقية
        // ==========================================

        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        btnExport.addEventListener('click', exportExcel);
        btnSendWA.addEventListener('click', sendToWhatsApp);
        
        btnAddManual.addEventListener('click', () => {
            const val = manualBarcode.value;
            if(val) {
                addBarcode(val);
                manualBarcode.value = '';
                manualBarcode.focus();
            }
        });

        // إضافة عند ضغط Enter
        manualBarcode.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') btnAddManual.click();
        });

        btnClearAll.addEventListener('click', () => {
            if(barcodes.length === 0) return;
            if(confirm("هل أنت متأكد من حذف جميع الباركودات؟")) {
                barcodes = [];
                saveData();
                updateList();
            }
        });

    </script>
</body>
</html>
